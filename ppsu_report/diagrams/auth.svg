<svg xmlns='http://www.w3.org/2000/svg' width='1380' height='250' viewBox='0 0 1380 250'>
<defs><marker id='ah' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#334155'/></marker></defs>
<rect width='100%' height='100%' fill='white'/><text x='690' y='34' font-family='Cambria, Georgia, serif' font-size='22' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>Authentication and Authorization Flow</text><rect x='30' y='80' width='200' height='95' rx='10' fill='#EFF6FF' stroke='#2563EB' stroke-width='2'/><text x='130' y='106' font-family='Cambria, Georgia, serif' font-size='15' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>Login / Register</text><text x='130' y='130' font-family='Cambria, Georgia, serif' font-size='12.5' fill='#475569' text-anchor='middle'>email + password (≥10 chars)</text><line x1='230' y1='127' x2='255' y2='127' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='255' y='80' width='200' height='95' rx='10' fill='#F0FDFA' stroke='#0D9488' stroke-width='2'/><text x='355' y='106' font-family='Cambria, Georgia, serif' font-size='15' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>bcrypt verify</text><text x='355' y='130' font-family='Cambria, Georgia, serif' font-size='12.5' fill='#475569' text-anchor='middle'>cost factor 10</text><line x1='455' y1='127' x2='480' y2='127' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='480' y='80' width='200' height='95' rx='10' fill='#EFF6FF' stroke='#2563EB' stroke-width='2'/><text x='580' y='106' font-family='Cambria, Georgia, serif' font-size='15' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>Issue JWT pair</text><text x='580' y='130' font-family='Cambria, Georgia, serif' font-size='12.5' fill='#475569' text-anchor='middle'>access + refresh token</text><line x1='680' y1='127' x2='705' y2='127' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='705' y='80' width='200' height='95' rx='10' fill='#F0FDFA' stroke='#0D9488' stroke-width='2'/><text x='805' y='106' font-family='Cambria, Georgia, serif' font-size='15' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>Store session id</text><text x='805' y='130' font-family='Cambria, Georgia, serif' font-size='12.5' fill='#475569' text-anchor='middle'>User.activeSessionToken</text><line x1='905' y1='127' x2='930' y2='127' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='930' y='80' width='200' height='95' rx='10' fill='#EFF6FF' stroke='#2563EB' stroke-width='2'/><text x='1030' y='106' font-family='Cambria, Georgia, serif' font-size='15' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>authMiddleware</text><text x='1030' y='130' font-family='Cambria, Georgia, serif' font-size='12.5' fill='#475569' text-anchor='middle'>verify token + session</text><line x1='1130' y1='127' x2='1155' y2='127' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='1155' y='80' width='200' height='95' rx='10' fill='#F0FDFA' stroke='#0D9488' stroke-width='2'/><text x='1255' y='106' font-family='Cambria, Georgia, serif' font-size='15' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>subscription</text><text x='1255' y='130' font-family='Cambria, Georgia, serif' font-size='12.5' fill='#475569' text-anchor='middle'>plan limits, credits</text><text x='690' y='225' font-family='Cambria, Georgia, serif' font-size='14' fill='#475569' text-anchor='middle'>A new login replaces activeSessionToken, invalidating older sessions (single active session). 401 → client calls /api/auth/refresh.</text></svg>