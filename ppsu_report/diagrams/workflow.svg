<rect width='100%' height='100%' fill='white'/><text x='710' y='34' font-family='Cambria, Georgia, serif' font-size='22' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>Overall Project Workflow</text><rect x='30' y='90' width='170' height='90' rx='10' fill='#EFF6FF' stroke='#2563EB' stroke-width='2'/><text x='115' y='116' font-family='Cambria, Georgia, serif' font-size='16' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>1. Problem Study</text><text x='115' y='140' font-family='Cambria, Georgia, serif' font-size='13' fill='#475569' text-anchor='middle'>Manual form building</text><line x1='200' y1='135' x2='226' y2='135' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='226' y='90' width='170' height='90' rx='10' fill='#F0FDFA' stroke='#0D9488' stroke-width='2'/><text x='311' y='116' font-family='Cambria, Georgia, serif' font-size='16' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>2. Requirements</text><text x='311' y='140' font-family='Cambria, Georgia, serif' font-size='13' fill='#475569' text-anchor='middle'>FR / NFR / scope</text><line x1='396' y1='135' x2='422' y2='135' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='422' y='90' width='170' height='90' rx='10' fill='#EFF6FF' stroke='#2563EB' stroke-width='2'/><text x='507' y='116' font-family='Cambria, Georgia, serif' font-size='16' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>3. Design</text><text x='507' y='140' font-family='Cambria, Georgia, serif' font-size='13' fill='#475569' text-anchor='middle'>Architecture, UML, ER</text><line x1='592' y1='135' x2='618' y2='135' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='618' y='90' width='170' height='90' rx='10' fill='#F0FDFA' stroke='#0D9488' stroke-width='2'/><text x='703' y='116' font-family='Cambria, Georgia, serif' font-size='16' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>4. Implementation</text><text x='703' y='140' font-family='Cambria, Georgia, serif' font-size='13' fill='#475569' text-anchor='middle'>Next.js + Express + AI</text><line x1='788' y1='135' x2='814' y2='135' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='814' y='90' width='170' height='90' rx='10' fill='#EFF6FF' stroke='#2563EB' stroke-width='2'/><text x='899' y='116' font-family='Cambria, Georgia, serif' font-size='16' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>5. Testing</text><text x='899' y='140' font-family='Cambria, Georgia, serif' font-size='13' fill='#475569' text-anchor='middle'>39 QA + 11 AI cases</text><line x1='984' y1='135' x2='1010' y2='135' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='1010' y='90' width='170' height='90' rx='10' fill='#F0FDFA' stroke='#0D9488' stroke-width='2'/><text x='1095' y='116' font-family='Cambria, Georgia, serif' font-size='16' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>6. Deployment</text><text x='1095' y='140' font-family='Cambria, Georgia, serif' font-size='13' fill='#475569' text-anchor='middle'>Vercel + Render + PG</text><line x1='1180' y1='135' x2='1206' y2='135' stroke='#334155' stroke-width='2'  marker-end='url(#ah)'/><rect x='1206' y='90' width='170' height='90' rx='10' fill='#EFF6FF' stroke='#2563EB' stroke-width='2'/><text x='1291' y='116' font-family='Cambria, Georgia, serif' font-size='16' font-weight='bold' fill='#1E3A8A' text-anchor='middle'>7. Evaluation</text><text x='1291' y='140' font-family='Cambria, Georgia, serif' font-size='13' fill='#475569' text-anchor='middle'>Results &amp; report</text><path d='M 1305 185 C 1305 270, 115 270, 115 185' fill='none' stroke='#B45309' stroke-width='2' stroke-dasharray='6,4' marker-end='url(#ah)'/><text x='710' y='262' font-family='Cambria, Georgia, serif' font-size='14' fill='#B45309' text-anchor='middle'>Iterative feedback from four progress reportings (Agile sprints)</text></svg>