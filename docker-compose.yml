version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: promptform-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: promptform_ai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promptform_ai"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  redis:
    image: redis:7-alpine
    container_name: promptform-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: