services:
  # 1. Express API backend service
  - type: web
    name: promptform-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:shared && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build:backend
    startCommand: npx prisma migrate deploy --schema=backend/prisma/schema.prisma && npm run start:backend
    healthCheckPath: /health/liveness
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: promptform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: promptform-redis
          property: connectionString
      - key: DISABLE_REDIS
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: uploads-data
      mountPath: /opt/render/project/src/backend/public/uploads
      sizeGB: 10

  # 2. Redis service (Cache + BullMQ queues)
  - type: redis
    name: promptform-redis
    plan: starter
    ipAllowList: [] # internal access only

databases:
  # 3. PostgreSQL database service
  - name: promptform-db
    plan: starter
    databaseName: promptform_ai
    user: promptform_admin
